name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Check app boundary
        run: |
          if grep -R "from src.models" app/; then
            echo "app must not import src.models directly"
            exit 1
          fi
      - name: Prepare integration data
        run: |
          python -m src.data.download
          python -m src.data.preprocess
          python -m src.data.splits
      - name: Test
        run: pytest -q
      - name: Ranking evaluation
        run: python scripts/run_ranking_eval.py
      - name: Item-CF smoke test
        run: python scripts/smoke_item_cf.py
      - name: Content-Based smoke test
        run: python scripts/smoke_content_based.py
      - name: Surprise smoke test
        run: python scripts/smoke_surprise.py
